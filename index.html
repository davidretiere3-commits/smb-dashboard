<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMB Promotion — Dashboard Prospection Foncière</title>
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e8821a;
    --green: #2e7d32;
    --red: #c62828;
    --orange: #ef6c00;
    --light: #f5f7fa;
    --border: #dde3ea;
    --text: #1a2a3a;
    --muted: #6b7a8d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--text); }

  /* HEADER */
  .app-header {
    background: var(--primary);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .5px; }
  .app-header span { font-size: .8rem; opacity: .75; }

  /* COMMUNE SELECTOR */
  .commune-bar {
    background: white;
    border-bottom: 2px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .commune-bar label { font-size: .85rem; font-weight: 600; color: var(--muted); }
  .commune-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    color: var(--text);
    transition: all .2s;
  }
  .commune-btn:hover { border-color: var(--accent); color: var(--accent); }
  .commune-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  /* SCORE BADGE */
  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: .85rem;
  }
  .score-chaud { background: #fff3e0; color: #e65100; }
  .score-tiede { background: #fff8e1; color: #f57f17; }
  .score-froid { background: #e8f5e9; color: #2e7d32; }
  .score-elimine { background: #fce4ec; color: #880e4f; }

  /* TABS */
  .tabs-nav {
    display: flex;
    gap: 4px;
    padding: 16px 24px 0;
    border-bottom: 2px solid var(--border);
    background: white;
  }
  .tab-btn {
    padding: 10px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    border-radius: 6px 6px 0 0;
    transition: all .2s;
  }
  .tab-btn:hover { color: var(--primary); background: var(--light); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: white; }

  .tab-content { display: none; padding: 24px; }
  .tab-content.active { display: block; }

  /* CARDS */
  .card {
    background: white;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 768px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }

  /* KPI BLOC */
  .kpi {
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    background: var(--light);
    border: 1px solid var(--border);
  }
  .kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
  .kpi-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }
  .kpi-sub { font-size: .8rem; color: var(--accent); font-weight: 600; }

  /* TABLE */
  .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .data-table th { background: var(--primary); color: white; padding: 8px 12px; text-align: left; }
  .data-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .data-table tr:hover td { background: #f0f4f8; }

  /* GAUGE */
  .gauge-bar { height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin: 6px 0; }
  .gauge-fill { height: 100%; border-radius: 5px; transition: width .5s; }

  /* SEGMENT CARD */
  .segment-card {
    padding: 14px;
    border-radius: 8px;
    border-left: 4px solid;
    margin-bottom: 10px;
  }
  .segment-card .seg-title { font-weight: 700; margin-bottom: 4px; }
  .segment-card .seg-score { font-size: .8rem; }
  .seg-A { border-color: #2e7d32; background: #e8f5e9; }
  .seg-B { border-color: #1565c0; background: #e3f2fd; }
  .seg-C { border-color: #ef6c00; background: #fff3e0; }
  .seg-D { border-color: #c62828; background: #fce4ec; }

  /* SCORING RADAR */
  .scoring-dims { display: flex; flex-direction: column; gap: 8px; }
  .dim-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .dim-label { width: 200px; flex-shrink: 0; }
  .dim-bar { flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
  .dim-bar-fill { height: 100%; border-radius: 4px; }
  .dim-score { width: 40px; text-align: right; font-weight: 700; }

  /* API SECTION */
  .api-section { margin-top: 12px; }
  .api-btn {
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: .9rem;
    transition: background .2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .api-btn:hover { background: #c96b10; }
  .api-btn:disabled { background: #aaa; cursor: not-allowed; }
  .api-response {
    margin-top: 12px;
    padding: 16px;
    background: #f0f4f8;
    border-radius: 8px;
    font-size: .88rem;
    line-height: 1.7;
    border-left: 3px solid var(--accent);
    white-space: pre-wrap;
  }
  .api-key-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: .85rem;
    margin-bottom: 10px;
  }
  .api-key-input:focus { outline: none; border-color: var(--accent); }
  .api-key-note { font-size: .75rem; color: var(--muted); margin-bottom: 12px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ALERT */
  .alert {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: .85rem;
    margin-bottom: 12px;
  }
  .alert-warning { background: #fff3e0; border-left: 3px solid var(--orange); color: #5d4037; }
  .alert-info { background: #e3f2fd; border-left: 3px solid #1565c0; color: #0d47a1; }
  .alert-success { background: #e8f5e9; border-left: 3px solid var(--green); color: #1b5e20; }

  /* PILL */
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: .75rem;
    font-weight: 600;
  }
  .pill-green { background: #e8f5e9; color: var(--green); }
  .pill-orange { background: #fff3e0; color: var(--orange); }
  .pill-red { background: #fce4ec; color: var(--red); }
  .pill-blue { background: #e3f2fd; color: #1565c0; }

  /* SLIDER */
  .slider-group { margin-bottom: 16px; }
  .slider-group label { font-size: .85rem; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 6px; }
  .slider-group label span { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* MAIRIE SCORE */
  .stars { color: var(--accent); font-size: 1.1rem; }

  /* HEADER COMMUNE */
  .commune-header {
    background: linear-gradient(135deg, var(--primary), #2a5f9e);
    color: white;
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .commune-header h2 { font-size: 1.4rem; font-weight: 800; }
  .commune-header .commune-meta { font-size: .85rem; opacity: .85; margin-top: 4px; }
  .commune-kpis { display: flex; gap: 16px; flex-wrap: wrap; }
  .commune-kpi { text-align: center; }
  .commune-kpi .val { font-size: 1.3rem; font-weight: 800; }
  .commune-kpi .lbl { font-size: .72rem; opacity: .8; }

  /* FOOTER */
  .app-footer {
    text-align: center;
    padding: 20px;
    font-size: .78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
</style>
</head>

function fmt(n, suffix) { return new Intl.NumberFormat('fr-FR').format(Math.round(n)) + (suffix||""); }
function stars(n) {
  var s = "";
  for(var i=1; i<=10; i++) s += i<=n ? "★" : "☆";
  return s;
}
function catBadge(cat) {
  var map = { chaud: ["score-chaud","🔥 CHAUD"], tiede: ["score-tiede","🟡 TIÈDE"], froid: ["score-froid","🔵 FROID"], elimine: ["score-elimine","❌ ÉLIMINÉ"] };
  var m = map[cat] || map.tiede;
  return '<span class="score-badge '+m[0]+'">'+m[1]+'</span>';
}
function segClass(p) { return "seg-"+p; }
function gaugeColor(v) {
  if(v>=75) return "#2e7d32";
  if(v>=50) return "#ef6c00";
  return "#c62828";
}

// ============================================================
// CAPACITE D'ACHAT CALC
// ============================================================
function calcCapacite(revenu, apport, duree) {
  var taux = duree===15 ? TAUX.t15 : duree===20 ? TAUX.t20 : TAUX.t25;
  var mensuel_max = revenu * 0.33;
  var r = taux / 100 / 12;
  var n = duree * 12;
  var emprunt = mensuel_max * (1 - Math.pow(1+r, -n)) / r;
  return Math.round(emprunt + apport);
}
function calcMensualite(montant, apport, duree) {
  var taux = duree===15 ? TAUX.t15 : duree===20 ? TAUX.t20 : TAUX.t25;
  var emprunt = montant - apport;
  var r = taux / 100 / 12;
  var n = duree * 12;
  return Math.round(emprunt * r / (1 - Math.pow(1+r,-n)));
}
function revenuNecessaire(prix, apport, duree) {
  var taux = duree===15 ? TAUX.t15 : duree===20 ? TAUX.t20 : TAUX.t25;
  var emprunt = prix - apport;
  var r = taux / 100 / 12;
  var n = duree * 12;
  var mensuel = emprunt * r / (1 - Math.pow(1+r,-n));
  return Math.round(mensuel / 0.33);
}

// ============================================================
// SRU CALC
// ============================================================
function sruCalc(c) {
  var obj = Math.ceil(c.logt_total * c.hlm_obj_pct / 100);
  var deficit = obj - c.hlm_existants;
  var tx = Math.round(c.hlm_existants / c.logt_total * 100 * 10) / 10;
  return { obj: obj, deficit: deficit, tx: tx };
}

          <div style="margin-top:4px"><span class="stars">${stars(c.score_maire)}</span> <span style="font-size:.8rem;color:var(--muted)">${c.score_maire}/10</span></div>
        </div>
      </div>
      <div style="padding:12px;border-radius:8px;background:${scoreBg};border-left:4px solid ${scoreColor}">
        <div style="font-size:.85rem;line-height:1.6">${c.profil_maire}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Score de sensibilité mairie</div>
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:3rem;font-weight:900;color:${scoreColor}">${c.score_maire}<span style="font-size:1.2rem">/10</span></div>
        <div style="font-size:.85rem;color:var(--muted);margin-top:8px">Score d'ouverture à la construction neuve</div>
      </div>
      <div class="scoring-dims">
        <div class="dim-row">
          <span class="dim-label">Ouverture collectif</span>
          <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.score_maire*10}%;background:${gaugeColor(c.score_maire*10)}"></div></div>
          <span class="dim-score">${c.score_maire}/10</span>
        </div>
        <div class="dim-row">
          <span class="dim-label">Sensibilité SRU</span>
          <div class="dim-bar"><div class="dim-bar-fill" style="width:${Math.min(100, sruCalc(c).deficit > 300 ? 80 : 50)}%;background:${gaugeColor(80)}"></div></div>
          <span class="dim-score">${sruCalc(c).deficit > 300 ? "Fort" : "Moyen"}</span>
        </div>
        <div class="dim-row">
          <span class="dim-label">Dialogue promoteur</span>
          <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.score_maire*10}%;background:${gaugeColor(c.score_maire*10)}"></div></div>
          <span class="dim-score">${c.score_maire >= 7 ? "✅" : c.score_maire >= 5 ? "⚠️" : "🔴"}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎯 Score global d'attractivité — ${c.nom}</div>
    <div class="grid-2">
      <div>
        <div class="scoring-dims">
          <div class="dim-row">
            <span class="dim-label">Constructibilité PLU (30%)</span>
            <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.scoring.constructibilite}%;background:${gaugeColor(c.scoring.constructibilite)}"></div></div>
            <span class="dim-score">${c.scoring.constructibilite}</span>
          </div>
          <div class="dim-row">
            <span class="dim-label">Pression SRU (25%)</span>
            <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.scoring.sru}%;background:${gaugeColor(c.scoring.sru)}"></div></div>
            <span class="dim-score">${c.scoring.sru}</span>
          </div>
          <div class="dim-row">
            <span class="dim-label">Sensibilité maire (20%)</span>
            <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.scoring.mairie}%;background:${gaugeColor(c.scoring.mairie)}"></div></div>
            <span class="dim-score">${c.scoring.mairie}</span>
          </div>
          <div class="dim-row">
            <span class="dim-label">Marché / solvabilité (15%)</span>
            <div class="dim-bar"><div class="dim-bar-fill" style="width:${c.scoring.marche}%;background:${gaugeColor(c.scoring.marche)}"></div></div>
            <span class="dim-score">${c.scoring.marche}</span>
          </div>
          <div class="dim-row" style="opacity:.8">
            <span class="dim-label">Risques (malus -10%)</span>
            <div class="dim-bar"><div class="dim-bar-fill" style="width:${Math.abs(c.scoring.risques)}%;background:#c62828"></div></div>
            <span class="dim-score" style="color:var(--red)">${c.scoring.risques}</span>
          </div>
        </div>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:.85rem;color:var(--muted);margin-bottom:8px">SCORE GLOBAL</div>
        <div style="font-size:3.5rem;font-weight:900;color:${gaugeColor(c.score_global)}">${c.score_global}</div>
        <div style="font-size:.8rem;color:var(--muted)">/ 100</div>
        <div style="margin-top:12px">${catBadge(c.categorie)}</div>
        <div style="font-size:.78rem;color:var(--muted);margin-top:8px">75-100 = Chaud · 50-74 = Tiède · 25-49 = Froid</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🤖 Stratégie approche mairie — IA</div>
    <div class="api-section">
      <p style="font-size:.83rem;color:var(--muted);margin-bottom:10px">Obtenez un argumentaire personnalisé pour aborder ${c.maire} à ${c.nom} : points d'entrée, angles d'approche, OAP à mentionner, levier SRU, et courrier d'approche sur mesure.</p>
      <button class="api-btn" onclick="callAPI('mairie', '${c.nom}', this)">
        <span>▶ Stratégie approche mairie IA</span>
      </button>
      <div id="api-mairie-${c.nom}" class="api-response" style="display:none"></div>
    </div>
  </div>`;
}

// ============================================================
// SCORING GLOBAL DISPLAY
// ============================================================
function buildScoringGlobal() {
  var rows = Object.values(COMMUNES).sort((a,b) => b.score_global - a.score_global);
  return rows.map(c => `
    <tr style="cursor:pointer" onclick="selectCommune('${Object.keys(COMMUNES).find(k=>COMMUNES[k]===c)}')">
      <td><strong>${c.nom}</strong></td>
      <td>${c.cp}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="gauge-bar" style="width:100px">
            <div class="gauge-fill" style="width:${c.score_global}%;background:${gaugeColor(c.score_global)}"></div>
          </div>
          <strong>${c.score_global}</strong>
        </div>
      </td>
      <td>${catBadge(c.categorie)}</td>
      <td>${c.maire}</td>
      <td>${c.score_maire}/10</td>
      <td style="color:var(--red);font-weight:700">${fmt(sruCalc(c).deficit)}</td>
    </tr>`).join("");
}

// ============================================================
// RENDER
// ============================================================
function selectCommune(key) {
  currentCommune = key;
  currentTab = 0;
  document.querySelectorAll(".commune-btn").forEach((b,i) => {
    b.classList.toggle("active", Object.keys(COMMUNES)[i] === key);
  });
  renderApp();
}

function switchTab(n) {
  currentTab = n;
  document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", i===n));
  document.querySelectorAll(".tab-content").forEach((t,i) => t.classList.toggle("active", i===n));
  if(n===2) setTimeout(()=>updateSim(currentCommune), 100);
}

function renderApp() {
  var c = COMMUNES[currentCommune];
  var main = document.getElementById("app-main");
  main.innerHTML = `
    <div class="commune-header">
      <div>
        <h2>📍 ${c.nom} <span style="font-size:.9rem;opacity:.7">(${c.cp})</span></h2>
        <div class="commune-meta">${c.interco} · ${c.dept} · ${fmt(c.pop)} habitants · Croissance ${c.pop_growth}</div>
        <div style="margin-top:8px">${catBadge(c.categorie)}</div>
      </div>
      <div class="commune-kpis">
        <div class="commune-kpi"><div class="val">${c.score_global}/100</div><div class="lbl">Score global</div></div>
        <div class="commune-kpi"><div class="val">${fmt(c.prix_appt)} €</div><div class="lbl">Appt /m²</div></div>
        <div class="commune-kpi"><div class="val">${fmt(sruCalc(c).deficit)}</div><div class="lbl">Déficit SRU</div></div>
        <div class="commune-kpi"><div class="val">${c.score_maire}/10</div><div class="lbl">Score mairie</div></div>
      </div>
    </div>

    <!-- SCORING GLOBAL -->
    <div style="padding:0 24px;margin-top:16px">
      <div class="card" style="margin-bottom:0">
        <div class="card-title" onclick="toggleScoringTable()" style="cursor:pointer">📊 Tableau comparatif toutes communes ▼</div>
        <div id="scoring-table" style="display:none">
          <table class="data-table">
            <tr><th>Commune</th><th>CP</th><th>Score</th><th>Catégorie</th><th>Maire</th><th>Score mairie</th><th>Déficit SRU</th></tr>
            ${buildScoringGlobal()}
          </table>
          <p style="font-size:.78rem;color:var(--muted);margin-top:8px">Cliquez sur une ligne pour accéder à la commune</p>
        </div>
      </div>
    </div>

    <!-- TABS NAV -->
    <div class="tabs-nav" style="margin:0 0 0 0;padding:16px 24px 0">
      <button class="tab-btn active" onclick="switchTab(0)">🏠 Analyse immobilière</button>
      <button class="tab-btn" onclick="switchTab(1)">⚖️ Analyse SRU</button>
      <button class="tab-btn" onclick="switchTab(2)">💶 Capacité d'achat</button>
      <button class="tab-btn" onclick="switchTab(3)">🏛️ Sensibilité mairie</button>
    </div>

    <!-- API KEY -->
    <div style="padding:0 24px">
      <div class="card" style="margin-top:16px;padding:14px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:.82rem;font-weight:600;color:var(--muted)">🔑 Clé API Claude :</span>
          <input type="password" id="api-key-field" class="api-key-input" style="flex:1;min-width:200px;margin:0"
            value="${apiKey}" placeholder="sk-ant-api-..." onchange="saveApiKey(this.value)">
          <button style="padding:6px 14px;font-size:.82rem;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:white"
            onclick="toggleApiKeyVisibility()">👁️</button>
        </div>
        <div class="api-key-note" style="margin-top:6px">Votre clé API Claude (Anthropic). Saisie locale uniquement, jamais transmise hors de votre navigateur.</div>
      </div>
    </div>

    <!-- TAB CONTENTS -->
    <div style="padding:0 24px">
      <div class="tab-content active">${buildTab0(c)}</div>
      <div class="tab-content">${buildTab1(c)}</div>
      <div class="tab-content">${buildTab2(c)}</div>
      <div class="tab-content">${buildTab3(c)}</div>
    </div>
  `;

  // Restore tab
  switchTab(currentTab);
  updateSim(currentCommune);
  syncApiKeyField();
}

function toggleScoringTable() {
  var el = document.getElementById("scoring-table");
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function toggleApiKeyVisibility() {
  var f = document.getElementById("api-key-field");
  f.type = f.type === "password" ? "text" : "password";
}

function saveApiKey(val) {
  apiKey = val;
  try { localStorage.setItem("smb_api_key", val); } catch(e) {}
}

function syncApiKeyField() {
  var f = document.getElementById("api-key-field");
  if(f) f.value = apiKey;
}

// ============================================================
// SIMULATOR UPDATE
// ============================================================
function updateSim(nom) {
  var slRev = document.getElementById("sl-rev");
  var slApport = document.getElementById("sl-apport");
  var slDuree = document.getElementById("sl-duree");
  if(!slRev) return;
  var rev = parseInt(slRev.value);
  var apport = parseInt(slApport.value);
  var duree = parseInt(slDuree.value);
  document.getElementById("lbl-rev").textContent = fmt(rev) + " €";
  document.getElementById("lbl-apport").textContent = fmt(apport) + " €";
  document.getElementById("lbl-duree").textContent = duree + " ans";
  var cap = calcCapacite(rev, apport, duree);
  var mensMax = Math.round(rev * 0.33);
  var taux = duree===15 ? TAUX.t15 : duree===20 ? TAUX.t20 : TAUX.t25;
  document.getElementById("res-capacite").textContent = fmt(cap) + " €";
  document.getElementById("res-mensualite").textContent = fmt(mensMax) + " €/mois";
  document.getElementById("res-taux").textContent = taux + "% sur " + duree + " ans";
}

// ============================================================
// API CALL
// ============================================================
function callAPI(type, nomCommune, btn) {
  var key = apiKey;
  if(!key || key === "VOTRE_CLE_API_ICI") {
    alert("⚠️ Veuillez saisir votre clé API Claude dans le champ en haut de page.");
    return;
  }
  var resId = "api-" + type + "-" + nomCommune;
  var resEl = document.getElementById(resId);
  if(!resEl) return;

  var c = COMMUNES[currentCommune];
  var s = sruCalc(c);
  var prompt = "";

  if(type === "marche") {
    prompt = `Tu es expert en analyse immobilière pour un promoteur (SMB Promotion, Nîmes). Fais une analyse marché concise pour ${c.nom} (${c.cp}, ${c.dept}).

Données clés :
- Population : ${fmt(c.pop)} hab · Croissance : ${c.pop_growth}
- Prix maisons : ${fmt(c.prix_maison)} €/m² · Appartements : ${fmt(c.prix_appt)} €/m²
- Prix terrain : ${fmt(c.prix_terrain)} €/m²
- Intercommunalité : ${c.interco}
- PLU : ${c.plu}

Donne : (1) Tendances marché 2025-2026, (2) Opportunités foncières identifiées, (3) Risques à surveiller, (4) Recommandation opérationnelle pour SMB Promotion.
Format : bullet points concis, ton professionnel. Maximum 400 mots.`;
  } else if(type === "sru") {
    prompt = `Tu es expert en logement social et loi SRU. Analyse la situation pour ${c.nom} (${c.cp}).

Situation SRU :
- Taux actuel : ${s.tx}% · Objectif : ${c.hlm_obj_pct}%
- Déficit : ${fmt(s.deficit)} logements sociaux
- Bailleurs présents : ${c.bailleurs.map(b=>b.nom).join(", ")}
- Profil maire : ${c.profil_maire}

Recommande : (1) Stratégie de rattrapage prioritaire, (2) Montage financier optimal (VEFA PLUS/PLAI, BRS), (3) Arguments à utiliser avec la mairie, (4) Bailleur à approcher en 1er et comment.
Format : plan d'action structuré. Maximum 450 mots.`;
  } else if(type === "capacite") {
    prompt = `Tu es expert en solvabilité des ménages pour l'immobilier neuf. Analyse la capacité d'achat à ${c.nom} (${c.cp}).

Données marché :
- Prix appartements : ${fmt(c.prix_appt)} €/m²
- Prix maisons : ${fmt(c.prix_maison)} €/m²
- Taux crédit sept. 2026 : 20 ans = ${TAUX.t20}%
- Population : ${fmt(c.pop)} hab · ${c.pop_growth}

Distribution revenus estimée :
${c.tranches_revenus.map(t=>t.tranche + " → " + t.pct + "% des ménages → " + t.segment).join("\n")}

Donne : (1) Profil de la clientèle cible solvable, (2) Produit le mieux adapté à la solvabilité locale, (3) Tension d'accession et risques, (4) Préconisation PSLA ou accession maîtrisée.
Maximum 400 mots.`;
  } else if(type === "mairie") {
    prompt = `Tu es consultant en développement immobilier. Prépare la stratégie d'approche de la mairie de ${c.nom} pour SMB Promotion.

Profil maire : ${c.maire} (${c.tendance_maire})
Score sensibilité : ${c.score_maire}/10
Profil : ${c.profil_maire}

Contexte SRU : déficit de ${fmt(s.deficit)} logements sociaux (${s.tx}% atteint, objectif ${c.hlm_obj_pct}%)

Rédige : (1) Arguments d'entrée en relation adaptés à ce maire, (2) Projet à présenter en premier (type, taille, mixité), (3) Points à éviter, (4) Premier paragraphe d'un courrier d'approche personnalisé.
Format : structuré, ton professionnel. Maximum 500 mots.`;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Analyse en cours...';
  resEl.style.display = "none";

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-calls": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-4-5",
      max_tokens: 700,
      messages: [{ role: "user", content: prompt }]
    })
  })
  .then(r => r.json())
  .then(data => {
    btn.disabled = false;
    btn.innerHTML = '<span>✅ Analyse terminée — Relancer</span>';
    if(data.content && data.content[0]) {
      resEl.textContent = data.content[0].text;
      resEl.style.display = "block";
    } else if(data.error) {
      resEl.textContent = "❌ Erreur API : " + (data.error.message || JSON.stringify(data.error));
      resEl.style.display = "block";
    }
  })
  .catch(err => {
    btn.disabled = false;
    btn.innerHTML = '<span>▶ Relancer l\'analyse</span>';
    resEl.textContent = "❌ Erreur de connexion : " + err.message + "\n\nVérifiez votre clé API et que le navigateur autorise les requêtes cross-origin.";
    resEl.style.display = "block";
  });
}

// ============================================================
// INIT
// ============================================================
renderApp();
</script>
</body>
</html>
